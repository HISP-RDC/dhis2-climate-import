# Example Open Climate Service configuration for the local OCS instance.
# Copy this to the OCS project/runtime that starts the climate service.

id: dhis2-climate-import-ocs
name: DHIS2 Climate Import Open Climate Service

extent:
  # Adjust this bounding box to the country/province covered by the DHIS2 instance.
  # Format: [min_lon, min_lat, max_lon, max_lat]
  bbox: [12.0, -14.0, 32.0, 6.0]
  country_code: COD

data_dir: ./data
plugins_dir: ./plugins
utc_offset_hours: 1

scheduler:
  enabled: false
