schema_version: 2
id: dhis2-x-to-y

source:
  instance: x

target:
  instance: y
  metadata:
    # If the target Data Set is absent, validate and import the official
    # DHIS2 dependency package before importing data values.
    mode: create_if_missing
    identity_strategy: preserve_uid
    # Allows guarded safe_repair during reconcile-metadata and transfer run.
    # Unsafe or ambiguous existing objects are still blocked.
    reconcile_existing: true
    skip_sharing: true
    import:
      strategy: CREATE
      atomic: true
    synchronization:
      enabled: true
      create_missing_objects: true
      attach_compatible_data_elements: true
      incompatible:
        policy: safe_repair
        require_no_data_values: true
        require_no_other_dataset_memberships: true
        require_same_identity: true
      historical_data_elements:
        enabled: true
        strategy: versioned
        # Never overwrite an incompatible historical UID already present on Y.
        # Clone its complete category graph and rewrite only the transferred values.
        uid_collision_strategy: clone
        name_suffix: " — Historique"

  organisation_units:
    # Uses the organisation units assigned to the source Data Set. Use
    # configured_roots/source_roots when a hierarchy root is more appropriate.
    discovery: linked_to_dataset
    mapping_strategy: uid
    include_children: false
    batch_size: 40
    synchronization:
      # Audit and repair the hierarchy/assignments before each parent transfer.
      # Existing units are never moved or overwritten.
      enabled: true
      run_before_transfer: true
      # Detect blocking identity/parent conflicts for every job and quarantine
      # only their affected source subtrees. During value validation, the same
      # policy quarantines E8031 values whose OU is inactive for that period.
      # Every exclusion remains audited; target OU dates are never modified.
      conflict_policy: exclude
      create_missing: true
      # UID and parent remain authoritative. Y intentionally uses prefixed OU
      # codes, while labels must stay identical to X.
      require_same_name: true
      require_same_code: false
      allow_root_creation: false
      attach_to_target_data_set: true
      preserve_geometry: true

mapping:
  data_elements: uid
  organisation_units: uid
  category_option_combos: uid
  attribute_option_combos: uid
  data_sets: uid

transfer:
  import_strategy: CREATE_AND_UPDATE
  chunk_size: 5000
  # Start fast, then halve only the target chunk that times out. This policy is
  # inherited by every job in the scenario.
  adaptive_chunking:
    enabled: true
    minimum_chunk_size: 500
    retry_before_split: 1
    backoff_seconds: 10
  preheat_cache: true
  include_deleted: false
  preserve_comments: true
  retry:
    attempts: 5
    initial_delay_seconds: 5
    max_delay_seconds: 120
  execution:
    process_isolation: true
    resume: true
    resume_chunks: true
    stop_on_error: true

execution:
  # Deux transferts de valeurs peuvent travailler en parallèle. Les jobs
  # supplémentaires attendent un créneau au lieu d'échouer.
  max_parallel_jobs: 2

state:
  directory: state

jobs:
  - id: weekly_climate
    source_data_set: CCH_CLIMATE_WEATHER
    target_data_set: CCH_CLIMATE_WEATHER
    period_type: week
    default_start_period: 2017-W01
    default_end_period: 2020-W52
    data_elements:
      discovery: linked_to_dataset
  - id: sigl_fosa
    source_data_set: oTgCLoG5OkY
    target_data_set: oTgCLoG5OkY
    period_type: month
    default_start_period: 2019-01
    default_end_period: 2022-12
    data_elements:
      discovery: linked_to_dataset
    transfer:
      # Export one DHIS2 month per source request; timeout responses are then
      # subdivided automatically by organisation unit.
      source_period_batch_size: 1
      execution:
        # Une tranche trimestrielle garde la mémoire bornée; chaque tranche
        # s'exécute dans un nouveau processus.
        period_batch_size: 3
        process_isolation: true
        resume: true
        stop_on_error: true
  - id: hospital_service
    source_data_set: OeWrFwkFMvf
    target_data_set: OeWrFwkFMvf
    period_type: month
    default_start_period: 2019-04
    default_end_period: 2022-12
    data_elements:
      discovery: linked_to_dataset
    transfer:
      # Export one DHIS2 month per source request; timeout responses are then
      # subdivided automatically by organisation unit.
      source_period_batch_size: 1
      execution:
        # Une tranche trimestrielle garde la mémoire bornée; chaque tranche
        # s'exécute dans un nouveau processus.
        period_batch_size: 3
        process_isolation: true
        resume: true
        stop_on_error: true
  - id: service_base
    source_data_set: pMbC0FJPkcm
    target_data_set: pMbC0FJPkcm
    period_type: month
    default_start_period: 2025-01
    default_end_period: 2025-12
    data_elements:
      discovery: linked_to_dataset
    transfer:
      # Export one DHIS2 month per source request; timeout responses are then
      # subdivided automatically by organisation unit.
      source_period_batch_size: 1
      execution:
        # Une tranche trimestrielle garde la mémoire bornée; chaque tranche
        # s'exécute dans un nouveau processus.
        period_batch_size: 3
        process_isolation: true
        resume: true
        stop_on_error: true
  - id: service_secondary
    source_data_set: maDtHIFrSHx
    target_data_set: maDtHIFrSHx
    period_type: month
    default_start_period: 2025-01
    default_end_period: 2025-12
    data_elements:
      discovery: linked_to_dataset
    transfer:
      # Export one DHIS2 month per source request; timeout responses are then
      # subdivided automatically by organisation unit.
      source_period_batch_size: 1
      execution:
        # Une tranche trimestrielle garde la mémoire bornée; chaque tranche
        # s'exécute dans un nouveau processus.
        period_batch_size: 3
        process_isolation: true
        resume: true
        stop_on_error: true
  - id: relevant_epidemiological_data
    source_data_set: Fo5ux0Ja21i
    target_data_set: Fo5ux0Ja21i
    period_type: week
    default_start_period: 2019-W01
    default_end_period: 2026-W40
    data_elements:
      discovery: linked_to_dataset
    transfer:
      # Export one DHIS2 week per source request; timeout responses are then
      # subdivided automatically by organisation unit.
      source_period_batch_size: 1
      execution:
        # Treize semaines par sous-processus gardent la mémoire bornée.
        period_batch_size: 13
        process_isolation: true
        resume: true
        stop_on_error: true
