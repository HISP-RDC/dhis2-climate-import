# Pipeline configuration. Secrets stay in .env.

dhis2:
  org_unit_level: 3
  # Y has no code on this Data Set, so its UID is the stable selector.
  # cache-data-elements only stores Data Elements attached to this Data Set.
  climate_data_set: mck6wRvBafz
  climate_data_sets:
    - mck6wRvBafz
  cache_max_age_hours: 168
  page_size: 500
  chunk_size: 5000
  async_threshold: 5000
  import_strategy: CREATE_AND_UPDATE
  preheat_cache: true
  trigger_analytics: false

open_climate_service:
  aggregate_process_id: aggregate_to_dhis2_json
  publish: true

imports:
  # Target mappings refreshed from Y on 2026-10-18. Y's Data Elements currently
  # have no codes, so every mapping deliberately uses a UID. All source dataset IDs
  # below are weekly OCS publication contracts; they must exist in OCS before import.

  - id: precipitation_weekly_chirps
    label: Precipitation (CHIRPS)
    dataset_id: chirps3_precipitation_weekly
    data_set: mck6wRvBafz
    data_element: DZte8CXJ6zJ
    period_type: week
    method: mean
    expected_units: mm

  - id: precipitation_weekly_era5_land
    label: Precipitation (ERA5-Land)
    dataset_id: era5land_precipitation_weekly
    data_set: mck6wRvBafz
    data_element: RMaMv7SrUYd
    period_type: week
    method: mean
    expected_units: mm

  - id: temperature_mean_weekly_era5_land
    label: Mean air temperature (ERA5-Land)
    dataset_id: era5land_temperature_weekly
    data_set: mck6wRvBafz
    data_element: Pjd8Rn6mTb0
    period_type: week
    method: mean
    expected_units: degC

  - id: temperature_max_weekly_era5_land
