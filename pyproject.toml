[project]
name = "dhis2-climate-import"
version = "0.1.0"
description = "Reliable climate data import orchestration for DHIS2 Climate App deployments."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dhis2-client @ git+https://github.com/dhis2/dhis2-python-client.git@v0.3.1",
]

[project.scripts]
dhis2-climate-import = "dhis2_climate_import.cli:main"

[project.urls]
Repository = "https://github.com/HISP-RDC/dhis2-climate-import"
Documentation = "https://github.com/HISP-RDC/dhis2-climate-import/tree/main/docs"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.pyright]
pythonVersion = "3.12"
include = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
